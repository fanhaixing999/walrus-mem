name: Deploy to Walrus Mainnet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的 GitHub 代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（已移除严格的锁文件缓存检查，彻底解决此报错）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # 💡 删除了 cache: 'npm' 这行，防止它因为找不到 package-lock.json 而崩溃

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 4. 编译纯静态网页
      - name: Build Static Site
        run: npm run build # 在根目录下生成编译后的 out/ 文件夹

      # 5. 使用 Mysten 官方专用的 Action 插件发布至 Walrus 主网
      - name: Deploy to Walrus Sites
        uses: MystenLabs/walrus-sites-github-actions/deploy@main
        with:
          site-path: './out'
          sui-private-key: ${{ secrets.SUI_PRIVATE_KEY }}
          network: 'mainnet'
