name: Deploy to Walrus Mainnet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 4. 静态打包
      - name: Build Static Site
        run: npm run build

      # 5. 官方插件一键推送 (严格按照最新标准对齐)
      - name: Deploy to Walrus Sites
        uses: MystenLabs/walrus-sites-github-actions/deploy@main
        with:
          DIST: './out'                                 # 💡 修正：全大写 DIST，100% 解决 <DIRECTORY> 缺失报错
          SUI_NETWORK: 'mainnet'                         # 锁定主网运行
          SUI_SECRET_PHRASE: ${{ secrets.SUI_PRIVATE_KEY }}  # 读取你的钱包私钥
          EPOCHS: 5                                     # 控制存储生命周期
