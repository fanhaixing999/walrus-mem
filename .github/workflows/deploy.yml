name: Deploy to Walrus Mainnet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 4. 静态打包
      - name: Build Static Site
        run: npm run build

      # 5. 官方插件一键推送 (已锁定超低 Epoch 扣费门槛)
      - name: Deploy to Walrus Sites
        uses: MystenLabs/walrus-sites-github-actions/deploy@main
        with:
          DIST: './out'
          SUI_NETWORK: 'mainnet'
          SUI_SECRET_PHRASE: ${{ secrets.SUI_PRIVATE_KEY }}
          EPOCHS: 5                                     # 💡 强控租期：大幅拉低上链所需的 SUI 余额门槛
