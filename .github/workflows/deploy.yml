name: Deploy to Walrus Mainnet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 4. 静态打包
      - name: Build Static Site
        run: npm run build

      # 5. 官方插件一键推送
      - name: Deploy to Walrus Sites
        uses: MystenLabs/walrus-sites-github-actions/deploy@v1
        with:
          DIST: './out'                           # 静态资源目录
          SUI_KEYSTORE: ${{ secrets.SUI_PRIVATE_KEY }} # 读取你的钱包私钥
          SUI_NETWORK: mainnet                    # 锁定主网运行
