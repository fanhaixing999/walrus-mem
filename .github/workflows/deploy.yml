name: Deploy to Walrus Mainnet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 4. 静态打包 (生成 out/ 文件夹)
      - name: Build Static Site
        run: npm run build

      # 5. 官方插件一键推送（严格采用官方新版参数名）
      - name: Deploy to Walrus Sites
        uses: MystenLabs/walrus-sites-github-actions/deploy@main
        with:
          DIST: './out'                                 # 静态网页文件夹路口
          SUI_NETWORK: 'mainnet'                         # 指定运行在 Walrus 主网
          SUI_SECRET_PHRASE: ${{ secrets.SUI_PRIVATE_KEY }}  # 💡 修正：官方新版要求的助记词/私钥参数名
